name: AgroCount IA — CI Pipeline & Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-and-test:
    name: Build, Test & Coverage Gate (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: QG-01 — Verify Python bytecode compilation
        run: PYTHONPATH=src python3 -m compileall -q src/ tests/ scripts/

      - name: QG-02 & QG-03 — Run Unit/Integration Tests & Enforce >= 80% Line Coverage
        run: bash scripts/verify.sh
